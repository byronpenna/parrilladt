version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd public_website && npm ci
    build:
      commands:
        - cd public_website && env | grep -e GRAPHQL_ >> .env.production
        - cd public_website && npm run build
  artifacts:
    baseDirectory: public_website/.next
    files:
      - '**/*'
  cache:
    paths:
      - public_website/node_modules/**/*
      - public_website/.next/cache/**/*
